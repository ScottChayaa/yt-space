<title>yt-space — 片段庫（桌機）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<style>
  :root{
    --bg:#0E0E10; --panel:#161619; --elev:#1E1E22; --hover:#26262B;
    --border:#2A2A30; --ink:#F1EDE6; --muted:#9C968A; --faint:#6E695F;
    --accent:#E28A44; --accent-ink:#1B140D; --accent-soft:#3A2A1A;
    --entity:#E79A80; --entity-bg:#37231C;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh;}

  /* Sidebar */
  .side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:4px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;}
  .brand .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#E28A44,#C05E9A);display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;}
  .brand b{font-size:16px;letter-spacing:-.01em;}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);cursor:pointer;font-size:14px;}
  .navitem svg{width:18px;height:18px;flex:none;}
  .navitem:hover{background:var(--hover);color:var(--ink);}
  .navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .navsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px;}
  .navitem .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .ent-dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#E7C79A,#C96A22);flex:none;}

  /* Main */
  .main{display:flex;flex-direction:column;min-width:0;position:relative;}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);}
  .search{position:relative;flex:1;max-width:560px;}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);width:18px;height:18px;}
  .search input{width:100%;background:var(--elev);border:1px solid var(--border);border-radius:11px;color:var(--ink);
    font-family:var(--sans);font-size:14px;padding:11px 14px 11px 42px;}
  .search input::placeholder{color:var(--faint);}
  .topbar .sp{flex:1;}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--border);background:var(--elev);cursor:pointer;}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#E28A44,#C05E9A);display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;}

  .scroll{flex:1;overflow-y:auto;padding:8px 64px 40px 20px;}
  .daygroup{margin-top:20px;}
  .dayhdr{display:flex;align-items:baseline;gap:10px;padding:10px 2px;position:sticky;top:0;background:var(--bg);z-index:2;}
  .dayhdr h2{font-size:15px;font-weight:600;}
  .dayhdr .sub{font-size:12.5px;color:var(--faint);}
  .dayhdr .chk{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:4px;}
  .cell{position:relative;aspect-ratio:1/1;border-radius:3px;overflow:hidden;cursor:pointer;background:#222;}
  .cell.wide{grid-column:span 2;aspect-ratio:2/1;}
  .cell .cat{position:absolute;inset:0;opacity:.4;}
  .cell .dur{position:absolute;right:6px;bottom:6px;font-family:var(--mono);font-size:10.5px;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px;}
  .cell .pin{position:absolute;left:6px;top:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);border-radius:5px;padding:1px 7px;display:flex;gap:4px;align-items:center;}
  .cell .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 45%);opacity:0;transition:opacity .15s;}
  .cell:hover .ov{opacity:1;}
  .cell .play{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s;}
  .cell:hover .play{opacity:1;}
  .cell .cap{position:absolute;left:8px;right:8px;bottom:6px;font-size:11.5px;color:#fff;opacity:0;transition:opacity .15s;line-height:1.3;}
  .cell:hover .cap{opacity:1;}

  /* Right timeline scrubber */
  .scrub{position:absolute;right:10px;top:64px;bottom:16px;width:44px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;gap:2px;padding-top:8px;font-family:var(--mono);}
  .scrub .yr{font-size:11px;color:var(--faint);padding:3px 6px;border-radius:5px;cursor:pointer;}
  .scrub .yr.on{color:var(--accent);font-weight:700;background:var(--accent-soft);}
  .scrub .yr:hover{color:var(--ink);}
  .scrub .mo{font-size:9px;color:var(--faint);opacity:.5;padding:1px 6px;}

  ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-thumb{background:#2f2f35;border-radius:6px;}
</style>

<div class="app">
  <!-- Sidebar -->
  <aside class="side">
    <div class="brand"><span class="mk">y</span><b>yt·space</b></div>
    <div class="navitem on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      片段庫<span class="n">1,248</span></div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      探索</div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      時間軸</div>
    <div class="navsec">實體</div>
    <div class="navitem"><span class="ent-dot"></span>小橘<span class="n">742</span></div>
    <div class="navitem"><span class="ent-dot" style="background:linear-gradient(135deg,#CFE0D2,#5E8C6A)"></span>媽媽<span class="n">210</span></div>
    <div class="navitem"><span class="ent-dot" style="background:linear-gradient(135deg,#E3C7D6,#9A5C7A)"></span>客廳<span class="n">356</span></div>
    <div class="navsec">收藏庫</div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l2.4 5 5.6.6-4.2 3.8 1.2 5.6L12 16.8 6.9 19l1.3-5.6L4 9.6 9.6 9z"/></svg>
      收藏</div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      垃圾桶</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input placeholder="用一句話搜尋片段，例如「2020~2025 小橘在沙發睡覺」" />
      </div>
      <div class="sp"></div>
      <button class="icon-btn" title="檢視密度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <div class="avatar">你</div>
    </div>

    <div class="scroll">
      <div class="daygroup">
        <div class="dayhdr"><h2>2023年3月5日</h2><span class="sub">週日 · 8 個片段</span><span class="chk"></span></div>
        <div class="grid" id="g1"></div>
      </div>
      <div class="daygroup">
        <div class="dayhdr"><h2>2022年12月25日</h2><span class="sub">週日 · 5 個片段</span><span class="chk"></span></div>
        <div class="grid" id="g2"></div>
      </div>
      <div class="daygroup">
        <div class="dayhdr"><h2>2021年8月12日</h2><span class="sub">週四 · 6 個片段</span><span class="chk"></span></div>
        <div class="grid" id="g3"></div>
      </div>
    </div>

    <!-- Timeline scrubber -->
    <div class="scrub">
      <span class="yr on">2025</span>
      <span class="mo">12</span><span class="mo">08</span>
      <span class="yr">2024</span>
      <span class="mo">06</span>
      <span class="yr">2023</span>
      <span class="mo">03</span>
      <span class="yr">2022</span>
      <span class="mo">12</span>
      <span class="yr">2021</span>
      <span class="mo">08</span>
      <span class="yr">2020</span>
    </div>
  </div>
</div>

<script>
  // NOTE: JS only for the Artifact preview; miro prototype uses the pre-rendered static version.
  const cat=(a,b)=>`<svg class="cat" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="lg${a}${b}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#lg${a}${b})"/><g fill="none" stroke="#2a1808" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".55" transform="translate(20,32) scale(.62)"><path d="M20 44c0-10 8-16 18-16s18 6 18 16"/><path d="M24 30l-4-10 9 5M52 30l4-10-9 5"/><circle cx="33" cy="37" r="2" fill="#2a1808"/><circle cx="43" cy="37" r="2" fill="#2a1808"/></g></svg>`;
  const palettes=[['#E7C79A','#C96A22'],['#CFE0D2','#5E8C6A'],['#E3C7D6','#9A5C7A'],['#D9CEE8','#6C5A9A'],['#F0D9B5','#B5772E'],['#C9DDE8','#4E7A94'],['#E8D3C7','#A5623E'],['#D2E0C7','#6E8C4E']];
  const caps=['小橘在沙發打盹','追逐逗貓棒','窗邊看鳥','嘔吐後看醫生','玩紙箱','曬太陽睡著','吃罐罐','被吸塵器嚇到'];
  function fill(id,n,widx){const g=document.getElementById(id);for(let i=0;i<n;i++){const p=palettes[(i+widx)%palettes.length];const d=document.createElement('div');d.className='cell'+((i%5===0&&i>0)?' wide':'');const mm=String(Math.floor(Math.random()*4)).padStart(2,'0'),ss=String(Math.floor(Math.random()*60)).padStart(2,'0');
    d.innerHTML=cat(p[0],p[1])+`<span class="pin"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="dur">${mm}:${ss}</span><div class="ov"></div><div class="play"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div><div class="cap">${caps[(i+widx)%caps.length]}</div>`;
    g.appendChild(d);} }
  fill('g1',8,0);fill('g2',5,3);fill('g3',6,1);
</script>
