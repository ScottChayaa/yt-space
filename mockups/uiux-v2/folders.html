<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 分類</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <div class="topbar">
    <span class="title">分類</span>
    <button class="more accent" id="add" aria-label="新增資料夾"></button>
  </div>
  <div class="fd-grid" id="list"></div>
  <div class="empty" id="empty" hidden></div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('nav').innerHTML = APP.renderNav('folders');
document.getElementById('add').innerHTML = APP.svg(APP.ICONS.folderPlus, 'ic');

/* 資料夾（含子孫層）裡的圖，拿來當卡片上的幻燈片 */
function shotsIn(id) {
  const ids = new Set(M.FOLDER_SHOTS[id] || []);
  for (const ch of M.folderChildren(id)) for (const s of shotsIn(ch.id)) ids.add(s.id);
  return M.CLIPS.filter(c => ids.has(c.id));
}
const pickShots = (list, n) => [...list].sort(() => Math.random() - 0.5).slice(0, n);

const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers = [];

function render() {
  timers.forEach(clearInterval);
  timers = [];

  const list = document.getElementById('list');
  list.innerHTML = '';
  const folders = M.folderChildren(null);

  folders.forEach((f, i) => {
    const shots = pickShots(shotsIn(f.id), 4);
    const frame = c => `<div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="片段縮圖"></div>`;

    const card = document.createElement('div');
    card.className = 'fd-card';
    card.innerHTML = `
      <div class="fd-shot">
        ${shots.length
          ? `<div class="fl on">${frame(shots[0])}</div><div class="fl">${shots[1] ? frame(shots[1]) : ''}</div>`
          : `<div class="ph">${APP.svg(APP.ICONS.folder, 'ic')}</div>`}
        <span class="fd-n">${M.folderCount(f.id)} 張</span>
      </div>
      <div class="fd-line"><span class="name">${f.name}</span></div>`;

    // 幻燈片：兩層交替淡入，每張卡的間隔錯開，整頁才不會一起換圖
    if (shots.length > 1 && !REDUCE_MOTION) {
      const layers = card.querySelectorAll('.fd-shot .fl');
      let idx = 0, front = 0;
      timers.push(setInterval(() => {
        if (document.hidden) return;
        idx = (idx + 1) % shots.length;
        const back = 1 - front;
        layers[back].innerHTML = frame(shots[idx]);
        layers[back].classList.add('on');
        layers[front].classList.remove('on');
        front = back;
      }, 4000 + i * 900));
    }

    APP.bindPress(card, {
      onTap: () => location.href = `folder.html?id=${f.id}`,
      onHold: () => openFolderMenu(f)
    });
    list.appendChild(card);
  });

  const emptyEl = document.getElementById('empty');
  emptyEl.hidden = folders.length > 0;
  if (!folders.length) {
    emptyEl.innerHTML = `${APP.svg(APP.ICONS.folder, 'ic')}
      <div>還沒有任何分類</div>
      <button class="btn secondary" id="emptyAdd">${APP.svg(APP.ICONS.folderPlus, 'ic')} 新增資料夾</button>`;
    document.getElementById('emptyAdd').onclick = addFolder;
  }
}

function openFolderMenu(f) {
  const sh = APP.openPanel(`
    <div class="srow"><span class="trange">${f.name}</span>
      <button class="close" onclick="closeSheet()">${APP.svg(APP.ICONS.close, 'ic')}</button></div>
    <button class="act-row" id="fmRen">${APP.svg(APP.ICONS.edit, 'ic')} 改名</button>
    <button class="act-row danger" id="fmDel">${APP.svg(APP.ICONS.trash, 'ic')} 刪除資料夾</button>`);
  sh.querySelector('#fmRen').onclick = () => {
    const name = prompt('新名稱？', f.name);
    if (name) { f.name = name.trim(); closeSheet(); render(); }
  };
  sh.querySelector('#fmDel').onclick = () => {
    const n = M.folderCount(f.id);
    if (!confirm(`刪除「${f.name}」？收藏的 ${n} 張圖本身不會被刪。`)) return;
    (function del(id) {
      for (const ch of M.folderChildren(id)) del(ch.id);
      const i = M.FOLDERS.findIndex(x => x.id === id);
      if (i >= 0) M.FOLDERS.splice(i, 1);
      delete M.FOLDER_SHOTS[id];
    })(f.id);
    closeSheet(); render();
    APP.toast('已刪除資料夾（圖片仍在首頁）');
  };
}

function addFolder() {
  const name = prompt('資料夾名稱？');
  if (name) { M.addFolder(name.trim(), null); render(); }
}
document.getElementById('add').onclick = addFolder;

render();
</script>
</body>
</html>
