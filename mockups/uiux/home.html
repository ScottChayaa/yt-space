<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 首頁</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <!-- 頂列：查詢時間（單擊選定年月 → 只顯示該月含以前的資料）-->
  <div class="topbar">
    <button class="date-trigger" id="dateTrigger">
      <span class="tlabel" id="dateLabel"></span>
    </button>
  </div>

  <div class="grid-scroll" id="grid"></div>
  <div class="empty" id="empty" style="display:none">此時間點以前沒有片段</div>

  <!-- immich 懸浮時間軸 -->
  <div class="scrubber" id="scrubber"></div>
  <div class="scrubber-bubble" id="scrubber-bubble"></div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('home');
  document.getElementById('dateTrigger').insertAdjacentHTML('afterbegin', APP.svg(APP.ICONS.calendar, 'ic'));
  document.getElementById('dateTrigger').insertAdjacentHTML('beforeend', APP.svg(APP.ICONS.chevronDown, 'ic'));

  // 只顯示已完成（reviewed）的 clip，依事件日期新到舊
  const reviewed = M.CLIPS.filter(c => c.status === 'reviewed')
    .sort((a, b) => b.eventDate.localeCompare(a.eventDate));

  const grid = document.getElementById('grid');
  const LS_KEY = 'ytspace_home_upto';
  const thisMonth = new Date().toISOString().slice(0, 7);
  let upTo = localStorage.getItem(LS_KEY) || thisMonth;   // 預設＝本月
  let groups = [];

  // 依「年月」分組建立網格（月份 desc）；比 upTo 更新的月份不顯示
  function render() {
    grid.innerHTML = '';
    groups = [];
    const list = reviewed.filter(c => c.eventDate.slice(0, 7) <= upTo);
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';

    let lastKey = null, container = null, group = null;
    for (const c of list) {
      const key = c.eventDate.slice(0, 7);
      if (key !== lastKey) {
        const g = document.createElement('div'); g.className = 'date-group';
        g.innerHTML = `<h2>${M.fmtMonthLabel(c.eventDate)}</h2><div class="month-tags"></div><div class="tiles"></div>`;
        grid.appendChild(g);
        container = g.querySelector('.tiles');
        group = { key, label: M.fmtMonthLabel(c.eventDate), el: g, tagsEl: g.querySelector('.month-tags'), tagMap: new Map() };
        groups.push(group);
        lastKey = key;
      }
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<div class="thumb"><div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="${c.summary || '片段縮圖'}"></div></div>`;
      tile.addEventListener('click', () => location.href = `detail.html?v=${c.videoId}&c=${c.id}`);
      container.appendChild(tile);
      for (const t of c.tags) if (!group.tagMap.has(t.name)) group.tagMap.set(t.name, t);
    }

    for (const g of groups) {
      g.tagsEl.innerHTML = [...g.tagMap.values()].map(t => APP.tagChip(t)).join('');
      g.tagsEl.querySelectorAll('.chip').forEach(chip =>
        chip.addEventListener('click', () => location.href = `tags.html?tag=${encodeURIComponent(chip.dataset.name)}`));
    }

    APP.setupScrubber(groups);
  }

  /* 套用時間：只保留該月（含）以前的資料 —— 最上方就是該月，往下滑即往更早 */
  function apply(key) {
    upTo = key;
    document.getElementById('dateLabel').textContent = APP.monthLabel(key) + ' 以前';
    localStorage.setItem(LS_KEY, key);
    render();
    window.scrollTo({ top: 0 });
  }

  document.getElementById('dateTrigger').onclick = () => APP.openMonthPicker({ value: upTo, onPick: apply });

  history.scrollRestoration = 'manual';   // 避免瀏覽器自動還原捲動位置蓋掉上面的 scrollTo
  apply(upTo);                            // 還原上次選定的時間（無則本月）
</script>
</body>
</html>
