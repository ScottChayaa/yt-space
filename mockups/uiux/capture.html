<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 取圖</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <div class="topbar">
    <span class="title center" id="wzTitle">取圖</span>
  </div>
  <div class="wz-steps" id="steps"><span></span><span></span><span></span><span></span></div>
  <div id="stage"></div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('nav').innerHTML = APP.renderNav('capture');

const params = new URLSearchParams(location.search);
const DRAFT_KEY = 'ytspace_capture_draft';
const stage = document.getElementById('stage');

/* 由真實 id 或 JS-safe key 找到 mock 影片 */
function findVideo(id) {
  if (M.VIDEOS[id]) return { key: id, v: M.VIDEOS[id] };
  for (const k in M.VIDEOS) if (M.VIDEOS[k].id === id) return { key: k, v: M.VIDEOS[k] };
  return null;
}
function parseVideoId(s) {
  s = (s || '').trim();
  let m = s.match(/(?:youtu\.be\/|shorts\/|[?&]v=)([\w-]{11})/);
  if (m) return m[1];
  if (/^[\w-]{11}$/.test(s)) return s;
  return null;
}

/* ───── 精靈狀態 ───── */
let W = null;   // { key, v, level, frames:[{t,manual,url}], selected:Set(t), dropped:Set(t), playT, step, onlySel, mode }

function setStep(n) {
  W.step = n;
  document.querySelectorAll('#steps span').forEach((el, i) => el.className = i < n ? 'done' : '');
  document.getElementById('wzTitle').textContent =
    n === 1 ? '取圖' : (W.mode === 'meta' ? '批次編輯圖資' : `《${W.v.title.slice(0, 14)}…》`);
  saveDraft();
  if (n === 1) renderStep1();
  else if (n === 2) renderStep2();
  else renderStep3();
  window.scrollTo(0, 0);
}

/* ───── 草稿 ───── */
function saveDraft() {
  if (!W || W.mode === 'meta' || W.step < 2) return;
  localStorage.setItem(DRAFT_KEY, JSON.stringify({
    id: W.v.id, step: W.step, sel: [...W.selected],
    manual: W.frames.filter(f => f.manual).map(f => f.t)
  }));
}
function clearDraft() { localStorage.removeItem(DRAFT_KEY); }

/* ───── 取圖歷史（完成取圖後寫入）───── */
const HIST_KEY = 'ytspace_capture_history';
function loadHistory() {
  const saved = localStorage.getItem(HIST_KEY);
  if (saved) return JSON.parse(saved);
  // mockup 預設帶三筆，示範歷史紀錄的樣子（也方便直接帶入示範影片）
  return ['Ea8ICLXTDaU', 'Pe226YsYVWk', '8QwV1fcYtfs'].map((id, i) => ({
    id, title: findVideo(id).v.title.slice(0, 18) + '…', n: [4, 3, 2][i], at: ['08/20', '07/12', '05/03'][i]
  }));
}
function pushHistory(id, title, n) {
  const d = new Date();
  const at = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  const list = loadHistory().filter(r => r.id !== id);
  list.unshift({ id, title: title.slice(0, 18) + '…', n, at });
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 20)));
}

/* ───── 第一步：輸入網址 ───── */
function renderStep1(err) {
  const history = loadHistory();
  stage.innerHTML = `
    <div class="wz-body wz-field has-fixed-go">
      <label>貼上 YouTube 網址或 videoId</label>
      <input type="text" id="url" placeholder="https://youtu.be/…" autocomplete="off">
      ${err ? `<div class="wz-err">${err}</div>` : ''}
      <label class="spaced">歷史紀錄</label>
      <div class="wz-hist">${history.length ? history.map(r => `
        <div class="hrow" data-id="${r.id}"><span class="ht">《${r.title}》</span></div>`).join('') : '<div class="empty">還沒有取過圖</div>'}</div>
    </div>
    <button class="qgo record" id="go">確定</button>`;
  const input = document.getElementById('url');
  // 點歷史紀錄＝帶入該支影片的網址
  stage.querySelectorAll('.hrow').forEach(row => row.onclick = () =>
    input.value = 'https://youtu.be/' + row.dataset.id);
  document.getElementById('go').onclick = () => {
    const id = parseVideoId(input.value);
    if (!id) return renderStep1('無法從輸入內容解析出 videoId');
    const found = findVideo(id);
    if (!found) return renderStep1('這支影片抓不到，可能是私人影片或已被刪除（mockup 僅支援示範影片）');
    startWizard(found);
  };
}

function startWizard(found, restore) {
  const spec = M.SB_SPECS[found.v.id];
  const parsed = spec && window.SB ? SB.parseStoryboardSpec(spec) : null;
  const level = parsed ? SB.pickLevel(parsed, 3) : null;
  const iv = level ? level.intervalMs / 1000 : 0;
  const frames = [];
  if (level) for (let k = 0; k < level.frameCount; k++) {
    const t = Math.round(k * iv);
    if (t <= found.v.duration) frames.push({ t });
  }
  // 已收藏的格子（同片再取圖時鎖定）
  const locked = new Set(M.CLIPS.filter(c => c.videoId === found.key)
    .map(c => Math.round(Math.round(c.start / iv) * iv || c.start)));
  W = { key: found.key, v: found.v, level, iv, frames, locked,
        selected: new Set(), dropped: new Set(), playT: 0, onlySel: false,
        mode: params.get('mode') || '' };
  if (restore) {
    for (const t of restore.manual || []) W.frames.push({ t, manual: true });
    W.frames.sort((a, b) => a.t - b.t);
    W.selected = new Set(restore.sel);
    return setStep(restore.step);
  }
  setStep(W.mode === 'meta' ? 3 : 2);   // 批次編輯直接進第三步
}

/* ───── 第二步：縮圖牆 ───── */
function renderStep2() {
  const noSB = !W.level;
  stage.innerHTML = `
    <div id="player" class="wz"></div>
    ${noSB ? `<div class="wz-tip">⚠ 無法取得這支影片的逐段縮圖（影片太短、直播中或剛上傳）。仍可用【手動補圖】收藏畫面。</div>` : ''}
    <div class="wz-tools">
      <button id="tAll" ${noSB ? 'disabled' : ''}>${APP.svg(APP.ICONS.check, 'ic')} 全部選取</button>
      <button id="tSim" ${noSB ? 'disabled' : ''}>${APP.svg(APP.ICONS.filter, 'ic')} 過濾相似</button>
      <button id="tManual">${APP.svg(APP.ICONS.imagePlus, 'ic')} 手動補圖</button>
      <button id="tOnly" class="${W.onlySel ? 'on' : ''}">${APP.svg(APP.ICONS.eye, 'ic')} 只看已選<span id="tOnlyN"></span></button>
    </div>
    <div id="tip1" class="wz-tip" style="display:none">點一下收藏 ・ 長按可跳到那一段看看</div>
    <div class="wz-grid" id="grid"></div>
    <div class="wz-foot">
      <span class="n" id="cnt"></span>
      <button class="go" id="next" disabled>下一步</button>
    </div>`;

  if (!localStorage.getItem('ytspace_tip_capture')) {
    document.getElementById('tip1').style.display = '';
    document.addEventListener('click', () => {
      document.getElementById('tip1')?.remove();
      localStorage.setItem('ytspace_tip_capture', '1');
    }, { once: true, capture: true });
  }

  // 播放器與詳情頁共用同一個元件
  const player = APP.mountPlayer(document.getElementById('player'),
    { videoId: W.key, duration: W.v.duration, at: W.playT, onSeek: sec => { W.playT = sec; markNow(); } });

  function markNow() {
    document.querySelectorAll('.wz-cell').forEach(el => {
      el.classList.toggle('now', Math.abs(+el.dataset.t - W.playT) < (W.iv || 2) / 2);
    });
  }

  function syncCnt() {
    document.getElementById('cnt').textContent = `共 ${W.frames.length} 張 · 已選 ${W.selected.size}`;
    document.getElementById('tOnlyN').textContent = W.selected.size ? ` ${W.selected.size}` : '';
    document.getElementById('next').disabled = W.selected.size === 0;
    saveDraft();
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (const f of W.frames) {
      if (W.onlySel && !W.selected.has(f.t)) continue;   // 被過濾掉的等同未選，不再另外顯示
      const el = document.createElement('div');
      el.className = ['wz-cell',
        W.selected.has(f.t) ? 'sel' : '',
        W.dropped.has(f.t) ? 'dropped' : '',
        W.locked.has(f.t) ? 'locked' : '',
        f.manual ? 'manual' : ''].join(' ').trim();
      el.dataset.t = f.t;
      el.style = f.url ? `background-image:url('${f.url}');background-size:cover` : M.thumbStyle(W.key, f.t);
      el.innerHTML = `<span class="tm">${M.fmtTime(f.t)}</span>`;
      APP.bindPress(el, {
        onTap: () => {
          if (W.locked.has(f.t)) return;
          if (W.dropped.has(f.t)) { W.dropped.delete(f.t); W.selected.add(f.t); }
          else W.selected.has(f.t) ? W.selected.delete(f.t) : W.selected.add(f.t);
          renderGrid();
        },
        onHold: () => { W.playT = f.t; player.seek(f.t); markNow(); }
      });
      grid.appendChild(el);
    }
    markNow(); syncCnt();
  }

  document.getElementById('tAll').onclick = () => {
    const all = W.frames.filter(f => !W.locked.has(f.t));
    if (W.selected.size < all.length) all.forEach(f => W.selected.add(f.t));
    else W.selected.clear();
    W.dropped.clear();
    renderGrid();
  };

  document.getElementById('tSim').onclick = () => {
    if (W.selected.size < 2) return APP.toast('至少要選 2 張才能過濾');
    // 強度改由「帳號 › 過濾相似強度」設定，這裡只讀值
    const thr = { h: W.iv * 2.2, m: W.iv * 1.1, l: W.iv * 0.5 }[localStorage.getItem('ytspace_sim_strength') || 'm'];
    const times = [...W.selected].sort((a, b) => a - b);
    let last = -1e9; const drops = [];
    for (const t of times) {
      if (t - last <= thr) drops.push(t);
      else last = t;
    }
    if (!drops.length) return APP.toast('沒有找到相似的縮圖（mock 以時間間距模擬）');
    const before = new Set(W.selected);
    drops.forEach(t => { W.selected.delete(t); W.dropped.add(t); });
    renderGrid();
    const toastEl = document.createElement('div');
    toastEl.className = 'wz-toast';
    toastEl.innerHTML = `<span>已過濾掉 ${drops.length} 張相似的</span><button>復原</button>`;
    document.body.appendChild(toastEl);
    toastEl.querySelector('button').onclick = () => { W.selected = before; W.dropped.clear(); renderGrid(); toastEl.remove(); };
    setTimeout(() => toastEl.remove(), 6000);
  };

  document.getElementById('tManual').onclick = () => {
    const sh = APP.openPanel(`
      <div class="srow"><span class="trange">手動補圖</span>
        <button class="close" onclick="closeSheet()">${APP.svg(APP.ICONS.close, 'ic')}</button></div>
      <div class="field"><label>時間點（自動帶入播放器目前位置）</label>
        <input id="mt" type="text" value="${M.fmtTime(W.playT)}"></div>
      <div class="field"><label>圖片（YouTube 播放器的畫面截不到，圖要自己截／自己選）</label>
        <input id="mf" type="file" accept="image/*"></div>
      <button class="confirm" id="mok">加入</button>`);
    sh.querySelector('#mok').onclick = () => {
      const [mm, ss] = sh.querySelector('#mt').value.split(':').map(Number);
      const t = (mm || 0) * 60 + (ss || 0);
      const file = sh.querySelector('#mf').files[0];
      const f = { t, manual: true, url: file ? URL.createObjectURL(file) : null };
      W.frames.push(f); W.frames.sort((a, b) => a.t - b.t);
      W.selected.add(t);
      closeSheet(); renderGrid();
      APP.toast(`已補上 ${M.fmtTime(t)} 的畫面`);
    };
  };

  document.getElementById('tOnly').onclick = (e) => {
    W.onlySel = !W.onlySel;
    e.currentTarget.classList.toggle('on', W.onlySel);
    renderGrid();
  };

  document.getElementById('next').onclick = () => {
    W.items = [...W.selected].sort((a, b) => a - b).map(t => {
      const f = W.frames.find(x => x.t === t);
      return { t, url: f?.url, applied: false,
               eventDate: '2026-08-20', place: '', tags: '', desc: '' };
    });
    setStep(3);
  };

  renderGrid();
}

/* 標籤在精靈裡以字串保存（沿用既有草稿格式），編輯時轉成 chip 物件 */
function parseTags(str) {
  const known = M.allTags();
  return (str || '').split(/[、,，]/).map(x => x.trim()).filter(Boolean)
    .map(n => ({ name: n, kind: (known.find(t => t.name === n) || {}).kind || 'topic', source: 'human' }));
}

/* ───── 第三步：定義圖資 ───── */
function renderStep3() {
  // 批次編輯模式：載入該影片的既有收藏
  if (W.mode === 'meta' && !W.items) {
    W.items = M.CLIPS.filter(c => c.videoId === W.key).map(c => ({
      t: c.start, ref: c, applied: true,
      eventDate: c.eventDate, place: c.place || '', tags: c.tags.map(t => t.name).join('、'), desc: c.summary || ''
    }));
  }
  const sel = new Set(W.items.map((_, i) => i));   // 進場預設全選
  const dirty = {};                                 // 這一輪抽屜被動過的欄位

  stage.innerHTML = `
    <div class="wz-tools">
      <button id="qAll">全選</button><button id="qNone">全不選</button>
      <button id="qInv">反選</button><button id="qTodo">未填的</button>
    </div>
    <div class="wz-grid cols4" id="grid3"></div>
    <div class="meta-drawer" id="drawer" style="display:none">
      <div class="dh" id="dTitle"></div>
      <div class="field"><label>時間（事件發生日）<span class="warn-inline">⚠ 預設帶入 YT 日期，可能不是拍攝日</span></label>
        <input id="dDate" type="date"></div>
      <div class="field"><label>地點</label><input id="dPlace" type="text" placeholder="例：宜蘭">
        <div class="sug" id="dPlaces"></div></div>
      <div class="field"><label>標籤</label><div class="tag-editor" id="dTags"></div></div>
      <div class="field"><label>描述</label><textarea id="dDesc" rows="2" placeholder="留空，之後 AI 補"></textarea></div>
      <button class="apply" id="dApply"></button>
    </div>
    <div class="wz-foot">
      <span class="n" id="cnt3"></span>
      <button class="go" id="finish">完成</button>
    </div>`;

  const fields = { dDate: 'eventDate', dPlace: 'place', dDesc: 'desc' };
  for (const id in fields) document.getElementById(id).addEventListener('input', () => dirty[fields[id]] = true);
  // 標籤是 chip 形式（與就地編輯共用 APP.tagEditor），不走上面那條 input 事件
  let drawerTags = [];
  APP.placeSuggest(document.getElementById('dPlaces'), document.getElementById('dPlace'),
    () => dirty.place = true);

  function fillDrawer() {
    const drawer = document.getElementById('drawer');
    if (!sel.size) { drawer.style.display = 'none'; return; }
    drawer.style.display = '';
    const list = [...sel].map(i => W.items[i]);
    document.getElementById('dTitle').textContent =
      sel.size === 1 ? `套用到已選的 1 張 ・ ${M.fmtTime(list[0].t)}` : `套用到已選的 ${sel.size} 張`;
    // 標籤：各張一致就直接編，不一致先顯示〈多個值〉
    const tagVals = new Set(list.map(x => x.tags));
    const host = document.getElementById('dTags');
    host.dataset.mixed = tagVals.size === 1 ? '0' : '1';
    drawerTags = tagVals.size === 1 ? parseTags([...tagVals][0]) : [];
    dirty.tags = false;
    APP.tagEditor(host, drawerTags, next => { drawerTags = next; dirty.tags = true; });
    for (const [id, key] of Object.entries(fields)) {
      const el = document.getElementById(id);
      const vals = new Set(list.map(x => x[key]));
      el.classList.remove('mix');
      if (vals.size === 1) { el.value = [...vals][0]; el.placeholder = ''; }
      else { el.value = ''; el.classList.add('mix'); el.placeholder = '〈多個值〉'; }
      dirty[key] = false;
    }
    document.getElementById('dApply').textContent = `套用到這 ${sel.size} 張`;
  }

  function renderGrid3() {
    const grid = document.getElementById('grid3');
    grid.innerHTML = '';
    W.items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = ['wz-cell', sel.has(i) ? 'sel' : '', it.applied && !sel.has(i) ? 'done-dot' : ''].join(' ').trim();
      el.style = it.url ? `background-image:url('${it.url}');background-size:cover` : M.thumbStyle(W.key, it.t);
      el.innerHTML = `<span class="tm">${M.fmtTime(it.t)}</span>`;
      el.onclick = () => { sel.has(i) ? sel.delete(i) : sel.add(i); renderGrid3(); };
      grid.appendChild(el);
    });
    document.getElementById('cnt3').textContent =
      `${W.items.length} 張 ・ ${W.items.filter(x => x.applied).length} 已完成`;
    fillDrawer();
  }

  document.getElementById('qAll').onclick = () => { W.items.forEach((_, i) => sel.add(i)); renderGrid3(); };
  document.getElementById('qNone').onclick = () => { sel.clear(); renderGrid3(); };
  document.getElementById('qInv').onclick = () => { W.items.forEach((_, i) => sel.has(i) ? sel.delete(i) : sel.add(i)); renderGrid3(); };
  document.getElementById('qTodo').onclick = () => { sel.clear(); W.items.forEach((it, i) => { if (!it.applied) sel.add(i); }); renderGrid3(); };

  document.getElementById('dApply').onclick = () => {
    // 蓋掉語意：只套用「這一輪動過」的欄位，沒動過的欄位各張維持原值
    for (const i of sel) {
      const it = W.items[i];
      for (const key of Object.values(fields)) if (dirty[key]) it[key] = document.getElementById(Object.keys(fields).find(k => fields[k] === key)).value;
      if (dirty.tags) it.tags = drawerTags.map(t => t.name).join('、');
      it.applied = true;
      if (it.ref) {   // 批次編輯模式：直接寫回既有 shot
        it.ref.eventDate = it.eventDate; it.ref.place = it.place; it.ref.summary = it.desc;
        it.ref.tags = it.tags.split(/[、,，]/).map(x => x.trim()).filter(Boolean)
          .map(n => it.ref.tags.find(t => t.name === n) || { name: n, kind: 'topic', source: 'human' });
      }
    }
    sel.clear(); renderGrid3();
    APP.toast('已套用');
  };

  document.getElementById('finish').onclick = () => {
    const todo = W.items.filter(x => !x.applied).length;
    if (todo && !confirm(`還有 ${todo} 張沒填資料，仍要完成嗎？（描述允許留空）`)) return;
    if (W.mode === 'meta') { clearDraft(); return location.href = `detail.html?v=${W.key}`; }
    // 寫進 mock 資料，讓首頁真的看得到
    W.items.forEach((it, i) => {
      M.CLIPS.push({
        id: 'n' + Date.now().toString(36) + i, videoId: W.key,
        start: it.t, end: it.t, eventDate: it.eventDate || '2026-08-20', status: 'reviewed',
        summary: it.desc, note: '', place: it.place,
        tags: it.tags.split(/[、,，]/).map(x => x.trim()).filter(Boolean).map(n => ({ name: n, kind: 'topic', source: 'human' }))
      });
    });
    clearDraft();
    pushHistory(W.v.id, W.v.title, W.items.length);
    sessionStorage.setItem('ytspace_toast', `已新增 ${W.items.length} 張`);
    // 首頁要自動跳到新圖所在的月份（否則會被「某月以前」的時間篩選擋住）
    sessionStorage.setItem('ytspace_jump', (W.items[0].eventDate || '2026-08').slice(0, 7));
    location.href = 'home.html';
  };

  renderGrid3();
}

/* ───── 入口 ───── */
const preset = params.get('v');
if (preset) {
  const found = findVideo(preset);
  found ? startWizard(found) : renderStep1('找不到這支影片');
} else {
  const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
  if (draft && findVideo(draft.id)) {
    const found = findVideo(draft.id);
    stage.innerHTML = `<div class="draft-ask">
      <div class="t">上次《${found.v.title.slice(0, 18)}…》做到第 ${draft.step} 步，要繼續嗎？</div>
      <div class="btns"><button class="primary" id="dGo">繼續</button><button id="dNew">重新開始</button></div></div>`;
    document.getElementById('dGo').onclick = () => startWizard(found, draft);
    document.getElementById('dNew').onclick = () => { clearDraft(); setStepInit(); };
  } else setStepInit();
}
function setStepInit() {
  document.querySelectorAll('#steps span')[0].className = 'done';
  renderStep1();
}
</script>
</body>
</html>
