<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 查詢結果</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <div class="topbar">
    <button class="back" id="backBtn"></button>
    <span class="title" id="title"></span>
  </div>

  <!-- 查詢條件：標籤／關鍵字（時間顯示在頂列）-->
  <div class="rs-head">
    <div class="rs-cond" id="cond"></div>
  </div>

  <div class="date-group" style="padding:6px 12px"><div class="tiles" id="tiles"></div></div>
  <div class="empty" id="empty" style="display:none">沒有符合的片段</div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('tags');
  document.getElementById('backBtn').innerHTML = APP.svg(APP.ICONS.back, 'ic');
  document.getElementById('backBtn').onclick = () =>
    history.length > 1 ? history.back() : location.href = 'tags.html';

  /* 查詢條件全部來自 URL —— 這頁不持有狀態，任何頁面都能連過來 */
  const P = new URLSearchParams(location.search);
  const tags = (P.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean);
  const q = (P.get('q') || '').trim();
  const upTo = P.get('upto') || '';        // '' = 全部日期

  const REVIEWED = M.CLIPS.filter(c => c.status === 'reviewed');
  const inRange = c => !upTo || c.eventDate.slice(0, 7) <= upTo;

  function matchesText(c, text) {
    const v = M.videoOf(c);
    const hay = [c.summary, c.note, v.title, M.channelOf(c), ...c.tags.map(t => t.name)].join(' ').toLowerCase();
    return text.toLowerCase().split(/\s+/).filter(Boolean).some(w => hay.includes(w));
  }

  function currentList() {
    return REVIEWED
      .filter(c => inRange(c)
        && (!tags.length || c.tags.some(t => tags.includes(t.name)))
        && (!q || matchesText(c, q)))
      .sort((a, b) => b.eventDate.localeCompare(a.eventDate));
  }

  // 頂列＝時間；條件列＝標籤／關鍵字
  const kindOf = name => {
    for (const c of REVIEWED) for (const t of c.tags) if (t.name === name) return t.kind;
    return 'topic';
  };
  document.getElementById('title').textContent = upTo ? APP.monthLabel(upTo) + ' 以前' : '全部日期';
  document.getElementById('cond').innerHTML = [
    ...tags.map(n => APP.tagChip({ name: n, kind: kindOf(n), source: 'human' })),
    q ? `<span class="chip">${APP.svg(APP.ICONS.search, 'kico')}<span class="cn">${q}</span></span>` : ''
  ].join('');

  function render() {
    const list = currentList();
    const tiles = document.getElementById('tiles');
    tiles.innerHTML = '';
    list.forEach((c, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<div class="thumb"><div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="${c.summary || '片段縮圖'}"></div></div>`;
      tile.onclick = () => APP.openLightbox(list, i, { onChange: render });
      tiles.appendChild(tile);
    });
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  }
  render();
</script>
</body>
</html>
