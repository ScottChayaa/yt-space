<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 設定</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <div class="topbar"><span class="title">設定</span></div>

  <!-- Google 帳號 -->
  <div class="account" id="account">
    <div class="avatar-lg">S</div>
    <div class="who">
      <div class="name">Scott Lin</div>
      <div class="mail">mmx112945@gmail.com</div>
    </div>
    <button class="chip" style="margin-left:auto">登出</button>
  </div>

  <!-- 標記行為 -->
  <div class="set-group">
    <div class="gt">標記行為</div>
    <div class="set-row">
      <div><div class="l">標記前秒數</div><div class="sub">一鍵標記記下當下往前的秒數</div></div>
      <div class="stepper"><button onclick="step('before',-1)">−</button><span class="v" id="before">20</span><button onclick="step('before',1)">＋</button></div>
    </div>
    <div class="set-row">
      <div><div class="l">標記後秒數</div><div class="sub">往後涵蓋的秒數</div></div>
      <div class="stepper"><button onclick="step('after',-1)">−</button><span class="v" id="after">10</span><button onclick="step('after',1)">＋</button></div>
    </div>
    <div class="set-row">
      <div><div class="l">標記時自動暫停</div><div class="sub">預設關閉，避免打斷觀看</div></div>
      <div class="toggle" id="pause" onclick="this.classList.toggle('on')"></div>
    </div>
  </div>

  <!-- 延遲處理（新） -->
  <div class="set-group">
    <div class="gt">代辦自動處理</div>
    <div class="set-row">
      <div><div class="l">延遲處理時間</div><div class="sub">標記後多久自動送 Gemini 分析（期間可取消）</div></div>
      <div class="stepper"><button onclick="step('delay',-1)">−</button><span class="v" id="delay">3 分</span><button onclick="step('delay',1)">＋</button></div>
    </div>
  </div>

  <!-- 縮圖健康 -->
  <div class="set-group">
    <div class="gt">縮圖服務</div>
    <div class="health"><span class="dot"></span>正常　·　最近探測 2026-08-08 03:00</div>
    <div class="set-row"><div class="l">立即重新探測</div><span class="val">›</span></div>
    <div class="set-row"><div class="l">重新抓取缺少的縮圖</div><span class="val">›</span></div>
  </div>

  <!-- 標籤管理 -->
  <div class="set-group">
    <div class="gt">標籤管理</div>
    <div class="section"><div class="chips" id="tagList"></div></div>
    <div class="set-row"><div class="l">合併 / 改名 / 編輯別名</div><span class="val">›</span></div>
  </div>

  <div style="padding:16px;color:var(--text-dim);font-size:.78rem">今日 Gemini 配額：0 分 / 8 小時</div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('settings');

  const state = { before: 20, after: 10, delay: 3 };
  window.step = (k, d) => {
    state[k] = Math.max(k === 'delay' ? 1 : 0, state[k] + d);
    document.getElementById(k).textContent = k === 'delay' ? state[k] + ' 分' : state[k];
  };

  document.getElementById('tagList').innerHTML =
    M.allTags().map(t => APP.tagChip(t, { count: t.count })).join('');

  if (location.hash === '#account') document.getElementById('account').scrollIntoView();
</script>
</body>
</html>
