<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 帳號</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <div class="topbar"><span class="title">帳號</span></div>

  <!-- Google 帳號 -->
  <div class="account" id="account">
    <div class="avatar-lg">S</div>
    <div class="who">
      <div class="name">Scott Lin</div>
      <div class="mail">mmx112945@gmail.com</div>
    </div>
    <button class="chip" style="margin-left:auto">登出</button>
  </div>

  <!-- 取圖偏好 -->
  <div class="set-group">
    <div class="gt">取圖</div>
    <div class="set-row">
      <div><div class="l">過濾相似強度</div><div class="sub">第二步【過濾相似】砍得多寡；強度高＝更容易判定相似</div></div>
      <select id="simStr" class="sel"><option value="h">高</option><option value="m">中</option><option value="l">低</option></select>
    </div>
  </div>

  <!-- AI 分析區間（第四步 v2 用，先顯示不生效） -->
  <div class="set-group">
    <div class="gt">AI 分析區間 <span style="text-transform:none">（第四步上線後生效）</span></div>
    <div class="set-row">
      <div><div class="l">往前秒數</div><div class="sub">送 AI 分析時，從時間點往前涵蓋的秒數</div></div>
      <div class="stepper"><button onclick="step('before',-1)">−</button><span class="v" id="before">10</span><button onclick="step('before',1)">＋</button></div>
    </div>
    <div class="set-row">
      <div><div class="l">往後秒數</div><div class="sub">往後涵蓋的秒數</div></div>
      <div class="stepper"><button onclick="step('after',-1)">−</button><span class="v" id="after">20</span><button onclick="step('after',1)">＋</button></div>
    </div>
  </div>

  <!-- 標籤管理 -->
  <div class="set-group">
    <div class="gt">標籤管理</div>
    <div class="section"><div class="chips" id="tagList"></div></div>
    <div class="set-row"><div class="l">合併 / 改名 / 編輯別名</div><span class="val">›</span></div>
  </div>

  <!-- 縮圖服務（僅使用者面的修復功能；健康狀態屬營運面不顯示） -->
  <div class="set-group">
    <div class="gt">縮圖服務</div>
    <div class="set-row"><div><div class="l">重新抓取缺少的縮圖</div><div class="sub">縮圖服務降級期間收藏的影片，恢復後在此批次補抓</div></div><span class="val">›</span></div>
  </div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('account');

  const state = { before: 10, after: 20 };
  window.step = (k, d) => {
    state[k] = Math.max(0, state[k] + d);
    document.getElementById(k).textContent = state[k];
  };

  document.getElementById('tagList').innerHTML =
    M.allTags().map(t => APP.tagChip(t, { count: t.count })).join('');
  // 過濾相似強度（取圖精靈第二步讀這個值）
  const simStr = document.getElementById('simStr');
  simStr.value = localStorage.getItem('ytspace_sim_strength') || 'm';
  simStr.onchange = () => localStorage.setItem('ytspace_sim_strength', simStr.value);
</script>
</body>
</html>
