<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 設定</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <!-- Google 帳號 -->
  <div class="account-hero">
    <div class="account" id="account">
      <div class="avatar-lg">S</div>
      <div class="who">
        <div class="name">Scott Lin</div>
        <div class="mail">mmx112945@gmail.com</div>
      </div>
      <button class="chip ghost-on-accent" style="margin-left:auto">登出</button>
    </div>
  </div>

  <!-- 三格統計：跨在 hero 下緣，每格都是入口 -->
  <div class="stat-card" id="stats"></div>

  <!-- 設定項目：只列入口，細節都在下一頁（Android 設定的作法）-->
  <div class="set-group split" id="menu"></div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('account');

  const st = M.stats();
  const cells = [
    { n: st.shots,     label: '收藏片段', ico: 'imagePlus', href: 'home.html' },
    { n: st.thisMonth, label: '本月新增', ico: 'plus',      href: 'home.html' },
    { n: st.videos,    label: '來源影片', ico: 'film',      href: 'home.html' }
  ];
  document.getElementById('stats').innerHTML = cells.map(c => `
    <a class="stat-item" href="${c.href}">
      <span class="stat-ico">${APP.svg(APP.ICONS[c.ico], 'ic')}</span>
      <span class="stat-n">${c.n}</span>
      <span class="stat-l">${c.label}</span>
    </a>`).join('');

  const SIM_LABEL = { h: '高', m: '中', l: '低' };
  const items = [
    { k: 'capture', ico: 'plus',   name: '取圖',     val: () => '過濾相似強度：' + SIM_LABEL[localStorage.getItem('ytspace_sim_strength') || 'm'] },
    { k: 'tags',    ico: 'search', name: '標籤管理', val: () => M.allTags().length + ' 個標籤' },
    { k: 'ai',      ico: 'film',   name: 'AI 分析',  val: () => '第四步上線後生效' },
    { k: 'thumbs',  ico: 'imagePlus', name: '縮圖服務', val: () => '重新抓取缺少的縮圖' }
  ];
  document.getElementById('menu').innerHTML = items.map(it => `
    <a class="set-row link" href="setting.html?k=${it.k}">
      ${APP.svg(APP.ICONS[it.ico], 'ic dim')}
      <div><div class="l">${it.name}</div><div class="sub">${it.val()}</div></div>
      ${APP.svg(APP.ICONS.chevronRight, 'ic dim arrow')}
    </a>`).join('');
</script>
</body>
</html>
