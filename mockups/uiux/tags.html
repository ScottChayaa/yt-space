<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 查詢</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <!-- 兩種查詢法 -->
  <div class="qtabs">
    <button id="tabTag" class="on">標籤</button>
    <button id="tabText">文字</button>
  </div>

  <!-- ── 標籤查詢：時間（預設本月）→ 標籤（可多選，往下滑）→ 確認 ── -->
  <div id="paneTag">
    <div class="qfield"><button class="date-trigger block" id="tagDate"><span class="tlabel" id="tagDateLabel"></span></button></div>
    <div class="tag-cloud" id="tagCloud"></div>
  </div>

  <!-- ── 文字查詢：時間 → 關鍵字／語意 ── -->
  <div id="paneText" style="display:none">
    <div class="qfield"><button class="date-trigger block" id="textDate"><span class="tlabel" id="textDateLabel"></span></button></div>
    <div class="qfield">
      <div class="search block" id="textBox">
        <input id="textInput" placeholder="例：加勒比海夜潛看到的大蝦">
      </div>
    </div>
  </div>
</div>

<!-- 確認查詢固定在底部 -->
<button class="qgo" id="go" disabled>確認查詢</button>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('tags');
  document.getElementById('textBox').insertAdjacentHTML('afterbegin', APP.svg(APP.ICONS.search, 'ic'));
  for (const id of ['tagDate', 'textDate']) {
    const el = document.getElementById(id);
    el.insertAdjacentHTML('afterbegin', APP.svg(APP.ICONS.calendar, 'ic'));
    el.insertAdjacentHTML('beforeend', APP.svg(APP.ICONS.chevronDown, 'ic'));
  }

  const REVIEWED = M.CLIPS.filter(c => c.status === 'reviewed');
  const selected = new Set();
  const thisMonth = new Date().toISOString().slice(0, 7);
  let mode = 'tag';
  let tagUpTo = thisMonth, textUpTo = thisMonth;   // 預設當前年月；'' = 全部日期
  const upTo = (clip, m) => !m || clip.eventDate.slice(0, 7) <= m;
  const dateText = m => m ? APP.monthLabel(m) + ' 以前' : '全部日期';

  /* ── 分頁切換 ── */
  function setMode(m) {
    mode = m;
    document.getElementById('tabTag').classList.toggle('on', m === 'tag');
    document.getElementById('tabText').classList.toggle('on', m === 'text');
    document.getElementById('paneTag').style.display = m === 'tag' ? '' : 'none';
    document.getElementById('paneText').style.display = m === 'text' ? '' : 'none';
    syncGo();
  }
  document.getElementById('tabTag').onclick = () => setMode('tag');
  document.getElementById('tabText').onclick = () => setMode('text');

  /* ── 標籤雲：自然寬度、換行往下排（不橫向捲動）── */
  function renderTags() {
    const map = new Map();
    for (const c of REVIEWED) {
      if (!upTo(c, tagUpTo)) continue;
      for (const t of c.tags) {
        if (!map.has(t.name)) map.set(t.name, { name: t.name, kind: t.kind, source: 'human', count: 0 });
        map.get(t.name).count++;
      }
    }
    const avail = [...map.values()].sort((a, b) => b.count - a.count);
    for (const n of [...selected]) if (!map.has(n)) selected.delete(n);

    const el = document.getElementById('tagCloud');
    el.innerHTML = avail.map(t => APP.tagChip(t, { count: t.count, selected: selected.has(t.name) })).join('')
      || '<span class="empty">此時間以前沒有標籤</span>';
    el.querySelectorAll('.chip').forEach(chip => chip.onclick = () => {
      const n = chip.dataset.name, on = selected.has(n);
      on ? selected.delete(n) : selected.add(n);
      chip.classList.toggle('sel', !on);
      syncGo();
    });
    syncGo();
  }
  function syncGo() {
    document.getElementById('go').disabled =
      mode === 'tag' ? selected.size === 0 : !document.getElementById('textInput').value.trim();
  }

  /* ── 時間（單擊即選定，只查該月含以前）── */
  document.getElementById('tagDate').onclick = () => APP.openMonthPicker({
    value: tagUpTo, title: '選擇時間',
    onPick: v => { tagUpTo = v; document.getElementById('tagDateLabel').textContent = dateText(v); renderTags(); },
    onClear: () => { tagUpTo = ''; document.getElementById('tagDateLabel').textContent = dateText(''); renderTags(); }
  });
  document.getElementById('textDate').onclick = () => APP.openMonthPicker({
    value: textUpTo, title: '選擇時間',
    onPick: v => { textUpTo = v; document.getElementById('textDateLabel').textContent = dateText(v); },
    onClear: () => { textUpTo = ''; document.getElementById('textDateLabel').textContent = dateText(''); }
  });

  document.getElementById('textInput').addEventListener('input', syncGo);

  /* ── 送出：導向獨立的結果頁（條件全帶在 URL）── */
  document.getElementById('go').onclick = () => {
    const p = new URLSearchParams();
    if (mode === 'tag') { p.set('tags', [...selected].join(',')); if (tagUpTo) p.set('upto', tagUpTo); }
    else { p.set('q', document.getElementById('textInput').value.trim()); if (textUpTo) p.set('upto', textUpTo); }
    location.href = 'results.html?' + p.toString();
  };

  document.getElementById('tagDateLabel').textContent = dateText(tagUpTo);
  document.getElementById('textDateLabel').textContent = dateText(textUpTo);
  renderTags();
</script>
</body>
</html>
