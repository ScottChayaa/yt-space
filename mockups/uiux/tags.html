<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yt-space · 查詢</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-main">
  <div class="topbar"><span class="title">查詢</span></div>

  <!-- 兩種查詢法 -->
  <div class="qtabs">
    <button id="tabTag" class="on">標籤查詢</button>
    <button id="tabText">文字查詢</button>
  </div>

  <!-- ── 標籤查詢：選時間 → 選標籤 → 確認查詢 ── -->
  <div id="paneTag">
    <div class="qstep">
      <div class="st"><b>1</b> 選擇時間（只查該月含以前）</div>
      <button class="date-trigger" id="tagDate"><span class="tlabel" id="tagDateLabel">全部日期</span></button>
    </div>
    <div class="qstep">
      <div class="st"><b>2</b> 點選想查的標籤（可多選，左右滑動看更多）</div>
    </div>
    <div class="tag-carousel" id="tagCarousel"></div>
    <button class="qgo" id="goTag" disabled>確認查詢</button>
  </div>

  <!-- ── 文字查詢：關鍵字／語意 → 選時間 → 確認查詢 ── -->
  <div id="paneText" style="display:none">
    <div class="qstep">
      <div class="st"><b>1</b> 輸入關鍵字，或用一句話描述（語意查詢）</div>
      <div class="search" id="textBox">
        <input id="textInput" placeholder="例：加勒比海夜潛看到的大蝦">
      </div>
    </div>
    <div class="qstep">
      <div class="st"><b>2</b> 選擇時間（只查該月含以前）</div>
      <button class="date-trigger" id="textDate"><span class="tlabel" id="textDateLabel">全部日期</span></button>
    </div>
    <button class="qgo" id="goText" disabled>確認查詢</button>
  </div>

  <!-- ── 查詢結果（按下確認才出現）── -->
  <div id="resultWrap" style="display:none">
    <div class="result-bar" id="resultBar"></div>
    <div class="date-group"><div class="tiles" id="results"></div></div>
    <div class="empty" id="empty" style="display:none">沒有符合的片段</div>
  </div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('tags');
  document.getElementById('textBox').insertAdjacentHTML('afterbegin', APP.svg(APP.ICONS.search, 'ic'));
  for (const id of ['tagDate', 'textDate']) {
    const el = document.getElementById(id);
    el.insertAdjacentHTML('afterbegin', APP.svg(APP.ICONS.calendar, 'ic'));
    el.insertAdjacentHTML('beforeend', APP.svg(APP.ICONS.chevronDown, 'ic'));
  }

  const REVIEWED = M.CLIPS.filter(c => c.status === 'reviewed');
  const selected = new Set();
  let tagUpTo = '', textUpTo = '';   // 截止月份（'' = 全部日期）；只查該月（含）以前

  const upTo = (clip, m) => !m || clip.eventDate.slice(0, 7) <= m;

  /* ── 分頁切換 ── */
  function setMode(mode) {
    document.getElementById('tabTag').classList.toggle('on', mode === 'tag');
    document.getElementById('tabText').classList.toggle('on', mode === 'text');
    document.getElementById('paneTag').style.display = mode === 'tag' ? '' : 'none';
    document.getElementById('paneText').style.display = mode === 'text' ? '' : 'none';
    document.getElementById('resultWrap').style.display = 'none';   // 換查詢法即收起舊結果
  }
  document.getElementById('tabTag').onclick = () => setMode('tag');
  document.getElementById('tabText').onclick = () => setMode('text');

  /* ── 標籤輪播（3 列，橫向捲動）── */
  function renderTags() {
    const map = new Map();
    for (const c of REVIEWED) {
      if (!upTo(c, tagUpTo)) continue;
      for (const t of c.tags) {
        if (!map.has(t.name)) map.set(t.name, { name: t.name, kind: t.kind, source: 'human', count: 0 });
        map.get(t.name).count++;
      }
    }
    const avail = [...map.values()].sort((a, b) => b.count - a.count);
    for (const n of [...selected]) if (!map.has(n)) selected.delete(n);

    const el = document.getElementById('tagCarousel');
    el.innerHTML = avail.map(t => APP.tagChip(t, { count: t.count, selected: selected.has(t.name) })).join('')
      || '<span style="color:var(--text-dim);font-size:.85rem">此區間沒有標籤</span>';
    el.querySelectorAll('.chip').forEach(chip => chip.onclick = () => {
      const n = chip.dataset.name, on = selected.has(n);
      on ? selected.delete(n) : selected.add(n);
      chip.classList.toggle('sel', !on);
      syncGo();
    });
    syncGo();
  }
  function syncGo() { document.getElementById('goTag').disabled = selected.size === 0; }

  /* ── 時間（單擊即選定，只查該月含以前）── */
  document.getElementById('tagDate').onclick = () => APP.openMonthPicker({
    value: tagUpTo, title: '選擇時間',
    onPick: v => { tagUpTo = v; document.getElementById('tagDateLabel').textContent = APP.monthLabel(v) + ' 以前'; renderTags(); },
    onClear: () => { tagUpTo = ''; document.getElementById('tagDateLabel').textContent = '全部日期'; renderTags(); }
  });
  document.getElementById('textDate').onclick = () => APP.openMonthPicker({
    value: textUpTo, title: '選擇時間',
    onPick: v => { textUpTo = v; document.getElementById('textDateLabel').textContent = APP.monthLabel(v) + ' 以前'; },
    onClear: () => { textUpTo = ''; document.getElementById('textDateLabel').textContent = '全部日期'; }
  });

  /* ── 文字查詢：mockup 以關鍵字比對代替，正式版此處走語意檢索 ── */
  const textInput = document.getElementById('textInput');
  textInput.addEventListener('input', () => document.getElementById('goText').disabled = !textInput.value.trim());
  function matches(c, q) {
    const v = M.videoOf(c);
    const hay = [c.summary, c.note, v.title, M.channelOf(c), ...c.tags.map(t => t.name)].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).some(w => hay.includes(w));
  }

  /* ── 結果 ── */
  function showResults(list, desc) {
    const wrap = document.getElementById('resultWrap');
    const results = document.getElementById('results');
    const empty = document.getElementById('empty');
    list.sort((a, b) => b.eventDate.localeCompare(a.eventDate));
    results.innerHTML = '';
    for (const c of list) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<div class="thumb"><div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="${c.summary || '片段縮圖'}"></div></div>`;
      tile.onclick = () => location.href = `detail.html?v=${c.videoId}&c=${c.id}`;
      results.appendChild(tile);
    }
    document.getElementById('resultBar').textContent = `${desc} · ${list.length} 筆`;
    empty.style.display = list.length ? 'none' : 'block';
    wrap.style.display = '';
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('goTag').onclick = () => showResults(
    REVIEWED.filter(c => upTo(c, tagUpTo) && c.tags.some(t => selected.has(t.name))),
    `${tagUpTo ? APP.monthLabel(tagUpTo) + ' 以前' : '全部日期'}｜標籤：${[...selected].join('、')}`
  );
  document.getElementById('goText').onclick = () => {
    const q = textInput.value.trim();
    showResults(
      REVIEWED.filter(c => upTo(c, textUpTo) && matches(c, q)),
      `${textUpTo ? APP.monthLabel(textUpTo) + ' 以前' : '全部日期'}｜「${q}」`
    );
  };

  /* ── 初始化：?tag= 由首頁月份標籤帶入，直接出結果 ── */
  renderTags();
  const preTag = new URLSearchParams(location.search).get('tag');
  if (preTag) {
    selected.add(preTag);
    renderTags();
    document.getElementById('goTag').click();
  }
</script>
</body>
</html>
