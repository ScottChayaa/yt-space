<title>yt-space — 影片校對</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<style>
  :root {
    --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EEE5; --ink:#211C16; --muted:#6F6656;
    --faint:#97907F; --border:#E7E0D5; --accent:#C96A22; --accent-ink:#FFFFFF; --accent-soft:#F6E7D6;
    --entity:#B24A2E; --entity-bg:#F6E1D9; --time:#2E6E63; --time-bg:#DCEEE9;
    --ok:#2F7D5B; --ok-bg:#DCEFE4; --warn:#B0791E; --warn-bg:#F6EBD3;
    --shadow:0 1px 2px rgba(33,28,22,.04),0 8px 24px -12px rgba(33,28,22,.16);
    --radius:14px;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype","Songti TC","PMingLiU",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#171310;--surface:#221D18;--surface-2:#2B251E;--ink:#F2ECE1;--muted:#A79E8C;--faint:#7C7463;
    --border:#332C24;--accent:#E28A44;--accent-ink:#1B140D;--accent-soft:#3A2A1A;
    --entity:#E79A80;--entity-bg:#37231C;--time:#86C9BB;--time-bg:#1E332F;
    --ok:#7FC49D;--ok-bg:#1E3329;--warn:#E0B75E;--warn-bg:#33290F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme="light"]{--bg:#FAF7F2;--surface:#FFFFFF;--surface-2:#F3EEE5;--ink:#211C16;--muted:#6F6656;--faint:#97907F;--border:#E7E0D5;--accent:#C96A22;--accent-ink:#FFFFFF;--accent-soft:#F6E7D6;--entity:#B24A2E;--entity-bg:#F6E1D9;--time:#2E6E63;--time-bg:#DCEEE9;--ok:#2F7D5B;--ok-bg:#DCEFE4;--warn:#B0791E;--warn-bg:#F6EBD3;--shadow:0 1px 2px rgba(33,28,22,.04),0 8px 24px -12px rgba(33,28,22,.16);}
  :root[data-theme="dark"]{--bg:#171310;--surface:#221D18;--surface-2:#2B251E;--ink:#F2ECE1;--muted:#A79E8C;--faint:#7C7463;--border:#332C24;--accent:#E28A44;--accent-ink:#1B140D;--accent-soft:#3A2A1A;--entity:#E79A80;--entity-bg:#37231C;--time:#86C9BB;--time-bg:#1E332F;--ok:#7FC49D;--ok-bg:#1E3329;--warn:#E0B75E;--warn-bg:#33290F;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:20px 18px 120px;}

  /* Top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .crumb{display:flex;align-items:center;gap:10px;min-width:0;}
  .back{border:1px solid var(--border);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none;}
  .back:hover{color:var(--ink);}
  .fname{font-family:var(--mono);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .queue{font-size:12.5px;color:var(--faint);}
  .toprt{display:flex;align-items:center;gap:8px;}
  .badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn);}
  .theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;}

  /* Layout */
  .grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start;}
  .left{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;}
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;}
    .left{position:static;}
  }

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .player{aspect-ratio:16/9;background:#12100d;border-radius:var(--radius) var(--radius) 0 0;position:relative;display:grid;place-items:center;overflow:hidden;}
  .player .lbl{position:absolute;top:9px;left:11px;font-size:11px;color:#c9c1b3;letter-spacing:.03em;}
  .player .pb{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;}
  .player .tl{position:absolute;left:0;right:0;bottom:26px;height:4px;background:rgba(255,255,255,.16);}
  .player .tl i{position:absolute;left:0;top:0;bottom:0;width:22%;background:var(--accent);}
  .player .tt{position:absolute;bottom:7px;left:11px;font-family:var(--mono);font-size:11px;color:#e8e2d6;}

  .pad{padding:14px;}
  .field{margin-bottom:13px;}
  .field:last-child{margin-bottom:0;}
  label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .req::after{content:" 必填";color:var(--accent);font-size:10px;}
  input[type=text],input[type=date],select,textarea{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);
    border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .yt-in{font-family:var(--mono);font-size:13px;}
  .hint{font-size:11.5px;color:var(--faint);margin-top:5px;}
  .hint.good{color:var(--ok);}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--border);}
  .kv:first-child{border-top:none;}
  .kv span{color:var(--muted);}
  .kv b{font-weight:500;font-family:var(--mono);}

  /* Right: segments */
  .rhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .rhead h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;}
  .rhead .n{font-size:13px;color:var(--muted);}
  .seglist{display:flex;flex-direction:column;gap:14px;}
  .seg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px;}
  .seg-top{display:grid;grid-template-columns:130px 1fr;gap:13px;}
  @media (max-width:430px){.seg-top{grid-template-columns:1fr;}}
  .seg-thumb{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#E7C79A,#C96A22 135%);}
  .seg-thumb .cat{position:absolute;inset:0;opacity:.35;}
  .seg-thumb .t{position:absolute;right:6px;bottom:6px;font-family:var(--mono);font-size:10.5px;color:#fff;background:rgba(20,14,8,.72);padding:2px 6px;border-radius:5px;}
  .seg-main{min-width:0;display:flex;flex-direction:column;gap:9px;}
  .row2{display:grid;grid-template-columns:1fr 148px;gap:10px;}
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}
  .sum-in{font-weight:600;font-size:15px;}
  .entities{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .echip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--entity);background:var(--entity-bg);padding:4px 9px;border-radius:999px;}
  .echip .x{cursor:pointer;opacity:.55;}.echip .x:hover{opacity:1;}
  .add-ent{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);background:transparent;border-radius:999px;padding:4px 10px;cursor:pointer;}
  .add-ent:hover{border-color:var(--accent);color:var(--accent);}
  .ai{margin-top:2px;border-top:1px solid var(--border);padding-top:9px;}
  .ai summary{cursor:pointer;font-size:12px;color:var(--faint);list-style:none;display:flex;align-items:center;gap:6px;}
  .ai summary::-webkit-details-marker{display:none;}
  .ai .arw{transition:transform .15s;}
  .ai[open] .arw{transform:rotate(90deg);}
  .ai-body{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;flex-direction:column;gap:7px;}
  .ai-body .tag{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;}
  .datewarn{font-size:11px;color:var(--warn);margin-top:4px;}

  /* Sticky action bar */
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
    box-shadow:0 -6px 20px -12px rgba(33,28,22,.3);z-index:30;}
  .actionbar .inner{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
  .status-msg{margin-right:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);}
  .dot.ok{background:var(--ok);}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div class="wrap">
  <div class="top">
    <div class="crumb">
      <button class="back" aria-label="返回清單">‹</button>
      <div style="min-width:0">
        <div class="fname">貓咪合輯_2020-2022.mp4</div>
        <div class="queue">待校對佇列 · 第 2 / 7 支</div>
      </div>
    </div>
    <div class="toprt">
      <span class="badge">待校對</span>
      <button class="theme-btn" id="theme" aria-label="切換主題">◐</button>
    </div>
  </div>

  <div class="grid">
    <!-- LEFT: player + video-level fields -->
    <div class="left">
      <div class="panel">
        <div class="player">
          <span class="lbl">本機草稿預覽</span>
          <div class="pb"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="tl"><i></i></div>
          <span class="tt">01:15 / 05:47</span>
        </div>
        <div class="pad">
          <div class="field">
            <label class="req" for="yt">YouTube 網址 / ID</label>
            <input type="text" id="yt" class="yt-in" placeholder="貼上 unlisted 影片網址…" />
            <div class="hint" id="ythint">上傳到 YouTube（unlisted）後，把網址貼進來 → 核准前必填</div>
          </div>
          <div class="field">
            <label>影片標題</label>
            <input type="text" value="貓咪合輯 2020–2022" />
          </div>
          <div class="field">
            <label>隱私狀態</label>
            <select><option>Unlisted（不公開）</option><option>Private（私人）</option></select>
          </div>
          <div style="margin-top:4px">
            <div class="kv"><span>來源檔名</span><b>貓咪合輯_2020-2022.mp4</b></div>
            <div class="kv"><span>總長度</span><b>05:47</b></div>
            <div class="kv"><span>片段數</span><b>3 段</b></div>
            <div class="kv"><span>Whisper</span><b>medium ✓</b></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: segment editor -->
    <div class="right">
      <div class="rhead">
        <h2>片段校對</h2>
        <span class="n">AI 已自動產生，請確認日期與實體</span>
      </div>
      <div class="seglist" id="seglist"></div>
    </div>
  </div>
</div>

<div class="actionbar">
  <div class="inner">
    <div class="status-msg"><span class="dot" id="sdot"></span><span id="stext">尚未填入 YouTube ID</span></div>
    <button class="btn ghost">儲存草稿</button>
    <button class="btn primary" id="approve" disabled>核准並寫入</button>
  </div>
</div>

<script>
  const root=document.documentElement;
  document.getElementById('theme').onclick=()=>{const c=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');root.setAttribute('data-theme',c==='dark'?'light':'dark');};

  const catSVG=`<svg class="cat" viewBox="0 0 100 60" fill="none" stroke="#3a2410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 44c0-10 8-16 18-16s18 6 18 16"/><path d="M24 30l-4-10 9 5M52 30l4-10-9 5"/><circle cx="33" cy="37" r="1.6" fill="#3a2410"/><circle cx="43" cy="37" r="1.6" fill="#3a2410"/><path d="M56 44c8 2 18-1 22-8"/></svg>`;

  // Segments across different years -> demonstrates per-segment date editing
  const segs=[
    {t:'00:00–01:48', date:'2020-06-14', sum:'小橘第一次到新家，怕生躲在紙箱裡',
     tr:'「來～這是你的新家喔」（主人聲音）', vd:'橘貓從紙箱探頭，環境為客廳，光線偏暗', ents:['小橘'], warn:'與影片預設年份不同（合輯）'},
    {t:'01:48–03:55', date:'2021-09-02', sum:'小橘在沙發上玩逗貓棒，跳來跳去',
     tr:'（無旁白）', vd:'橘貓在米色沙發上追逐逗貓棒，動作活潑', ents:['小橘'], warn:'與影片預設年份不同（合輯）'},
    {t:'03:55–05:47', date:'2022-12-25', sum:'聖誕節小橘睡在暖爐旁的毯子上',
     tr:'「聖誕快樂～」（背景音樂）', vd:'橘貓蜷在紅色毯子上熟睡，旁有聖誕裝飾', ents:['小橘'], warn:''},
  ];

  const list=document.getElementById('seglist');
  segs.forEach((s,i)=>{
    const el=document.createElement('div');el.className='seg';
    el.innerHTML=`
      <div class="seg-top">
        <div class="seg-thumb">${catSVG}<span class="t">${s.t.split('–')[0]}</span></div>
        <div class="seg-main">
          <div class="row2">
            <input class="sum-in" type="text" value="${s.sum}" aria-label="事件描述"/>
            <input type="date" value="${s.date}" aria-label="片段日期"/>
          </div>
          ${s.warn?`<div class="datewarn">⚠ ${s.warn}，已逐段設定</div>`:''}
          <div class="entities">
            ${s.ents.map(e=>`<span class="echip">${e}<span class="x">×</span></span>`).join('')}
            <button class="add-ent">＋ 實體</button>
          </div>
          <details class="ai">
            <summary><span class="arw">▸</span> AI 原始分析（字幕 / 畫面）</summary>
            <div class="ai-body">
              <div><span class="tag">字幕 STT</span><br>${s.tr}</div>
              <div><span class="tag">畫面 Gemini</span><br>${s.vd}</div>
            </div>
          </details>
        </div>
      </div>`;
    list.appendChild(el);
  });

  // entity chip remove + add (demo)
  list.addEventListener('click',e=>{
    if(e.target.classList.contains('x'))e.target.closest('.echip').remove();
    if(e.target.classList.contains('add-ent')){
      const name=prompt('指定實體（demo）：輸入名稱，如 小橘 / 媽媽 / 客廳','小橘');
      if(name){const c=document.createElement('span');c.className='echip';c.innerHTML=name+'<span class="x">×</span>';e.target.before(c);}
    }
  });

  // approve gating on YouTube ID
  const yt=document.getElementById('yt'),ap=document.getElementById('approve'),
        dot=document.getElementById('sdot'),st=document.getElementById('stext'),hint=document.getElementById('ythint');
  yt.addEventListener('input',()=>{
    const ok=yt.value.trim().length>3;
    ap.disabled=!ok;dot.classList.toggle('ok',ok);
    st.textContent=ok?'已就緒，可核准寫入 dev D1 + R2':'尚未填入 YouTube ID';
    hint.textContent=ok?'✓ 將以此 video_id 作為主鍵寫入':'上傳到 YouTube（unlisted）後，把網址貼進來 → 核准前必填';
    hint.classList.toggle('good',ok);
  });
  ap.onclick=()=>{st.textContent='已寫入 ✓（demo）';};
</script>
