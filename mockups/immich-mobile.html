<title>yt-space — 片段庫（手機）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<style>
  :root{
    --bg:#0E0E10; --panel:#161619; --elev:#1E1E22; --border:#2A2A30;
    --ink:#F1EDE6; --muted:#9C968A; --faint:#6E695F;
    --accent:#E28A44; --accent-ink:#1B140D; --accent-soft:#3A2A1A;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:66px;}

  .status{height:20px;}
  .hdr{padding:10px 14px 6px;display:flex;align-items:center;gap:10px;}
  .hdr .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#E28A44,#C05E9A);display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex:none;}
  .hdr b{font-size:17px;}
  .hdr .avatar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E28A44,#C05E9A);display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;}

  .search{position:relative;margin:6px 14px 4px;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);width:17px;height:17px;}
  .search input{width:100%;background:var(--elev);border:1px solid var(--border);border-radius:12px;color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:11px 12px 11px 40px;}
  .search input::placeholder{color:var(--faint);}

  .dayhdr{display:flex;align-items:baseline;gap:8px;padding:16px 14px 8px;}
  .dayhdr h2{font-size:14.5px;font-weight:600;}
  .dayhdr .sub{font-size:12px;color:var(--faint);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px;}
  .cell{position:relative;aspect-ratio:1/1;overflow:hidden;background:#222;}
  .cell.tall{grid-row:span 2;aspect-ratio:1/2;}
  .cell .cat{position:absolute;inset:0;}
  .cell .dur{position:absolute;right:4px;bottom:4px;font-family:var(--mono);font-size:9.5px;color:#fff;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px;}
  .cell .pin{position:absolute;left:4px;top:4px;color:#fff;opacity:.9;}

  /* Bottom tab bar */
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--panel);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 14px;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;}
  .tab svg{width:22px;height:22px;}
  .tab.on{color:var(--accent);}

  /* Floating search FAB alt (semantic) */
  .hint{margin:8px 14px 0;font-size:11.5px;color:var(--faint);}
</style>

<div class="status"></div>
<div class="hdr"><span class="mk">y</span><b>片段庫</b><span class="avatar">你</span></div>
<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
  <input placeholder="搜尋片段，例如「小橘 打針」" />
</div>

<div class="dayhdr"><h2>2023年3月5日</h2><span class="sub">週日 · 8 個</span></div>
<div class="grid" id="g1"></div>
<div class="dayhdr"><h2>2022年12月25日</h2><span class="sub">週日 · 5 個</span></div>
<div class="grid" id="g2"></div>
<div class="dayhdr"><h2>2021年8月12日</h2><span class="sub">週四 · 6 個</span></div>
<div class="grid" id="g3"></div>

<nav class="tabs">
  <div class="tab on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    片段</div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    搜尋</div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l2.4 5 5.6.6-4.2 3.8 1.2 5.6L12 16.8 6.9 19l1.3-5.6L4 9.6 9.6 9z"/></svg>
    收藏</div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    我的</div>
</nav>

<script>
  const cat=(a,b,i)=>`<svg class="cat" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="m${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#m${i})"/><g fill="none" stroke="#2a1808" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".5" transform="translate(22,34) scale(.58)"><path d="M20 44c0-10 8-16 18-16s18 6 18 16"/><path d="M24 30l-4-10 9 5M52 30l4-10-9 5"/><circle cx="33" cy="37" r="2.2" fill="#2a1808"/><circle cx="43" cy="37" r="2.2" fill="#2a1808"/></g></svg>`;
  const pal=[['#E7C79A','#C96A22'],['#CFE0D2','#5E8C6A'],['#E3C7D6','#9A5C7A'],['#D9CEE8','#6C5A9A'],['#F0D9B5','#B5772E'],['#C9DDE8','#4E7A94'],['#E8D3C7','#A5623E'],['#D2E0C7','#6E8C4E']];
  let gi=0;
  function fill(id,n){const g=document.getElementById(id);for(let i=0;i<n;i++){const p=pal[gi%pal.length];const d=document.createElement('div');d.className='cell'+((i===1)?' tall':'');const mm=String(Math.floor(Math.random()*4)).padStart(2,'0'),ss=String(Math.floor(Math.random()*60)).padStart(2,'0');
    d.innerHTML=cat(p[0],p[1],gi)+`<span class="pin"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="dur">${mm}:${ss}</span>`;g.appendChild(d);gi++;} }
  fill('g1',8);fill('g2',5);fill('g3',6);
</script>
